<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Net-Tech" />
    <meta name="theme-color" content="#0a131f" />

    <!--
      Title, description, canonical, Open Graph and JSON-LD are emitted per
      route by src/components/site/Seo.tsx at build time. Nothing page-specific
      belongs in this shell. A static canonical here is what previously told
      Google every URL was the home page.
    -->

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- GA4 loads after page load or first interaction. Page loads and SPA history
         changes are measured by enhanced measurement; do not add a second router
         page_view sender. Brief visits may end before the deferred script loads. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-81YTRTKY6S");

      (function loadAnalytics() {
        var started = false;

        function start() {
          if (started) return;
          started = true;
          var s = document.createElement("script");
          s.async = true;
          s.src = "https://www.googletagmanager.com/gtag/js?id=G-81YTRTKY6S";
          document.head.appendChild(s);
        }

        if (document.readyState === "complete") {
          start();
        } else {
          window.addEventListener("load", start, { once: true });
        }
        // Catches anyone who scrolls or taps on a slow connection before load.
        ["pointerdown", "keydown", "scroll"].forEach(function (evt) {
          window.addEventListener(evt, start, { once: true, passive: true });
        });
      })();
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
